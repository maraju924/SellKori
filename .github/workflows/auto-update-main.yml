name: Auto-update main

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-main
  cancel-in-progress: false

jobs:
  merge-cursor-work:
    if: github.repository == 'maraju924/SellKori'
    runs-on: ubuntu-latest
    steps:
      - name: Merge Cursor pull requests into main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const eventPr = context.payload.pull_request;

            async function mergePr(pr) {
              if (pr.merged_at || pr.state !== 'open') return false;
              if (!String(pr.head?.ref || '').startsWith('cursor/')) return false;
              if (pr.head?.repo?.full_name && pr.head.repo.full_name !== `${owner}/${repo}`) {
                core.info(`Skip fork PR #${pr.number}`);
                return false;
              }
              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: pr.title,
                });
                core.info(`Merged PR #${pr.number}: ${pr.title}`);
                return true;
              } catch (error) {
                core.warning(`Could not merge PR #${pr.number}: ${error.message}`);
                return false;
              }
            }

            if (eventPr) {
              await mergePr(eventPr);
              return;
            }

            const open = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            let merged = 0;
            for (const pr of open) {
              if (await mergePr(pr)) merged += 1;
            }
            core.info(`Merged ${merged} open Cursor PR(s) into main`);
